    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: "8000"
      - key: MONGODB_URI
        value: mongodb+srv://surya:surya@cluster0.vyreenm.mongodb.net/attendence?retryWrites=true&w=majority
      - key: DB_NAME
        value: attendence
      - key: TELEGRAM_BOT_TOKEN
        value: "8523038213:AAErnH_G_r4mnCH1wfgBe-JTTFNjDgdjwXs"
      - key: TELEGRAM_BOT_USERNAME
        value: LBRCEattendancebot
      - key: ERP_BASE_URL
        value: https://erp.lbrce.ac.in
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
