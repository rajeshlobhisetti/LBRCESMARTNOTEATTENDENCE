{% extends "base.html" %}

{% block title %}Admin Login &bull; LBRCE Attendance Platform{% endblock %}

{% block content %}
<div class="py-20 px-4 sm:px-6 lg:px-8 max-w-md mx-auto">
  <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200 p-8">
    
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-slate-900 to-slate-700 text-white mx-auto flex items-center justify-center text-xl shadow-md mb-3">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Admin Portal</h1>
      <p class="text-xs text-slate-500 mt-1">Authorized personnel only &bull; Database & Scraper controls</p>
    </div>

    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-5">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="username">
          Username
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-user-shield text-sm"></i>
          </span>
          <input type="text" id="username" name="username" required placeholder="admin"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="password">
          Password
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fa-solid fa-lock text-sm"></i>
          </span>
          <input type="password" id="password" name="password" required placeholder="••••••••"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition">
        </div>
      </div>

      <div id="loginAlert" class="hidden p-3 rounded-xl text-xs font-medium bg-rose-50 border border-rose-200 text-rose-700"></div>

      <button type="submit" id="loginBtn"
        class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Sign In to Dashboard</span>
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 text-center">
      <a href="/" class="text-xs text-blue-600 hover:underline">
        &larr; Back to Student Registration
      </a>
    </div>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  async function handleAdminLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const alertBox = document.getElementById('loginAlert');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Authenticating...';
    alertBox.className = 'hidden';

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      const data = await res.json();

      if (res.ok && data.success) {
        localStorage.setItem('admin_token', data.token);
        window.location.href = '/admin/dashboard';
      } else {
        alertBox.className = 'p-3 rounded-xl text-xs font-medium bg-rose-50 border border-rose-200 text-rose-700 block';
        alertBox.innerHTML = '❌ ' + (data.detail || 'Invalid username or password');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> Sign In to Dashboard';
      }
    } catch (err) {
      alertBox.className = 'p-3 rounded-xl text-xs font-medium bg-rose-50 border border-rose-200 text-rose-700 block';
      alertBox.innerHTML = '❌ Network connection error';
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> Sign In to Dashboard';
    }
  }
</script>
{% endblock %}
